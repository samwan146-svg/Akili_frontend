<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akili — Portal Login</title>
  <style>
    body {
      background: #0d0e12;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: system-ui, sans-serif;
    }
    .login-card {
      background: #13151a;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #22252e;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    label {
      display: block;
      color: #a0a5b5;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: #1b1d24;
      border: 1px solid #2d313f;
      padding: 12px;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #059669; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1f2937;
      padding: 16px 24px;
      border-radius: 8px;
      border-left: 4px solid #ef4444;
      color: white;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
      <span style="font-size: 28px;">🧠</span>
      <h2 style="color: white; margin: 0; font-size: 24px; font-weight: 700;">Akili</h2>
    </div>
    
    <h3 style="color: #a0a5b5; margin: 0 0 24px 0; font-weight: 500; font-size: 16px;">Sign in to your dashboard</h3>

    <form id="login-form" onsubmit="handleAuth(event)">
      <div>
        <label>Email Address</label>
        <input type="email" id="auth-email" required placeholder="name@school.com">
      </div>

      <div>
        <label>Password</label>
        <input type="password" id="auth-password" required placeholder="••••••••">
      </div>

      <button type="submit">Access System</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = "https://jodasa-backend.onrender.com/api";

    function showError(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 4000);
    }

    async function handleAuth(event) {
      event.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        // Hitting your custom SimpleJWT endpoint on Render
        const res = await fetch(`${API_BASE}/token/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        if (res.ok) {
          const data = await res.json();
          
          // Lock down tokens and metadata localized to the device
          localStorage.setItem('akili_token', data.access);
          localStorage.setItem('akili_user_role', data.role_name.toLowerCase()); 

          // Smart router execution branch
          routeUserRole(data.role_name.toLowerCase());
        } else {
          showError("❌ Invalid credentials. Please try again.");
        }
      } catch (err) {
        showError("❌ Communication breakdown with Render engine.");
      }
    }

    function routeUserRole(role) {
      if (role === 'admin' || role === 'bursar') {
        window.location.href = 'admin_dashboard.html';
      } else if (role === 'teacher') {
        window.location.href = 'teacher_dashboard.html';
      } else {
        window.location.href = 'portal.html';
      }
    }
  </script>
</body>
</html>
